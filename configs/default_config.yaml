upstreams:
  - name: ollama
    base_url: http://host.orb.internal:11434
    default_model: gemma4:e2b-mlx
  - name: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-flash

models:
  - logic_model: local 
    upstreams:
              - ollama
              - deepseek
